name: cpm-ci

# CI of the cloud-pool-managers fork: GitHub-hosted runners, build tags spelled out.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (linux/amd64, tags testing)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build and vet
        run: |
          go build -mod=vendor ./...
          go vet -mod=vendor -tags testing ./...
      - name: Format
        run: test -z "$(gofmt -l -s client provider config main.go)"
      - name: Unit tests
        run: go test -race -mod=vendor -tags testing -count=1 ./...
