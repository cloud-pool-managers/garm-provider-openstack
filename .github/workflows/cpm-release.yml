name: cpm-release

# Builds the release asset of a fork tag `vMAJOR.MINOR.PATCH` and publishes it with SHA256SUMS.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          go build -mod=vendor -trimpath -ldflags "-s -w" -o dist/garm-provider-openstack .
          tar -C dist -czf "dist/garm-provider-openstack-${{ github.ref_name }}-linux-amd64.tar.gz" garm-provider-openstack
          rm dist/garm-provider-openstack
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # ghrelease creates the GitHub release (with its notes) when it tags,
          # so the release already exists by the time this runs: attach the
          # assets to it, and create it only when it is absent.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* --title "${TAG}" \
              --notes "cloud-pool-managers fork build of garm-provider-openstack (see README for the tag scheme). Verify with SHA256SUMS."
          fi
